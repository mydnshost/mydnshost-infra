sources:
  docker:
    type: docker_logs
    include_labels:
      - mydnshost.log=true

transforms:
  shape:
    type: remap
    inputs: [docker]
    source: |
      if .message == "" { abort }
      . = {
        "timestamp": .timestamp,
        "message": .message,
        "stream": .stream,
        "service": string(.label."com.docker.compose.service") ?? string!(.container_name),
        "container_name": .container_name,
        "container_id": .container_id,
        "image": .image,
      }

sinks:
  vlogs:
    type: elasticsearch
    inputs: [shape]
    endpoints: [http://victorialogs:9428/insert/elasticsearch/]
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: service,container_name
